name: markdown-iOS
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 7H64C3G53A
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  markdown-iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: [web]
        buildPhase: resources
      - path: Resources/web
        type: folder
        buildPhase: resources
      - path: ../LICENSE.txt
        buildPhase: resources
      - path: ../THIRD-PARTY-NOTICES.txt
        buildPhase: resources
      - path: ../Welcome.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: markdown
        PRODUCT_BUNDLE_IDENTIFIER: app.jola.markdown.ios
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  markdown-iOS-Tests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: markdown-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jola.markdown.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  markdown-iOS:
    build:
      targets:
        markdown-iOS: all
    test:
      targets:
        - markdown-iOS-Tests
    archive:
      config: Release
